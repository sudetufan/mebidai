<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/error.css') }}"
    >
</head>
<body>

<div class="error-container">

    <div class="error-code">
        404
    </div>

    <h1 class="error-title">
        Page Not Found
    </h1>

    <p class="error-message">
        The page you're looking for doesn't exist.
    </p>

    <a
        href="/"
        class="home-button"
    >
        Back Home
    </a>

</div>

</body>
</html>
