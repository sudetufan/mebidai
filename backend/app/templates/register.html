{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<section class="login-page">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Create Account</h1>

            <p>
                Join the <strong>MEBIDAI</strong> developer community.
            </p>

        </div>

        <form id="registerForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Choose a username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="name@example.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Create a strong password"
                    required
                >

            </div>

            <button
                class="primary-btn"
                type="submit"
            >
                Create Account
            </button>

        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div
            id="g_id_onload"
            data-client_id="{{ google_client_id }}"
            data-callback="handleGoogleLogin">
        </div>

        <div
            class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="signup_with"
            data-shape="rectangular"
            data-logo_alignment="left">
        </div>

        <script src="https://accounts.google.com/gsi/client" async defer></script>

        <div class="auth-footer">

            <p>
                Already have an account?

                <a href="/login">
                    Sign in
                </a>

            </p>

        </div>

    </div>

</section>

<script src="/static/js/register.js" defer></script>

{% endblock %}
