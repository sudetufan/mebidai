{% extends "base.html" %}

{% block title %}
Reset Password - MEBIDAI
{% endblock %}

{% block content %}

<div class="login-page">
    <div class="auth-card">
        
        <!-- Header -->
        <div class="auth-header">
            <div style="width: 48px; height: 48px; background: #e0e7ff; color: #4f46e5; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px;">
                🔒
            </div>
            <h1>Reset Password</h1>
            <p>Please enter your new password below.</p>
        </div>

        <!-- Form -->
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                    id="newPassword"
                    type="password"
                    placeholder="Enter new password"
                    required
                >
            </div>

            <button type="submit" class="primary-btn">
                Reset Password
            </button>
        </form>

        <!-- Footer Link -->
        <div class="auth-footer">
            <a href="/login">← Back to Login</a>
        </div>

    </div>
</div>

<script src="/static/js/reset-password.js"></script>

{% endblock %}
