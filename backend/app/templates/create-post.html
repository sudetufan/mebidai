{% extends "base.html" %}

{% block title %}
Create Post
{% endblock %}
{% block content %}
<section class="create-page">
    <div class="create-card">
        <div class="create-header">
            <h1>
                Create New Post
            </h1>
            <p>
                Share your knowledge with the MEBIDAI community.
            </p>
        </div>
        <form method="post" action="/create-post">
            <div class="form-group">

                <label for="title">
                    Title
                </label>
                <input
                    id="title"
                    type="text"
                    name="title"
                    placeholder="Post title..."
                    required
                >
            </div>
            <div class="form-group">

                <label for="content">
                    Content
                </label>
                <textarea
                    id="content"
                    name="content"
                    rows="10"
                    placeholder="Write your article..."
                    required
                ></textarea>
            </div>

            <div class="form-group">

                <label for="category">
                    Category
                </label>
                <select
                    id="category"
                    name="category_id"
                    required
                >
                    {% for category in categories %}

                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>

                    {% endfor %}
                </select>
            </div>
            <button 
                class="primary-btn"
                type="submit"
            >
                Publish Post

            </button>
        </form>
    </div>
</section>
{% endblock %}
