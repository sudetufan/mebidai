{% extends "base.html" %}

{% block title %}
Forgot Password - MEBIDAI
{% endblock %}

{% block content %}

<div style="max-width: 420px; margin: 40px auto; padding: 32px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);">
    
    <!-- Header Icon & Title -->
    <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 48px; height: 48px; background: #e0e7ff; color: #4f46e5; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px;">
            🔑
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 0 0 6px 0;">
            Forgot Password?
        </h1>
        <p style="font-size: 0.875rem; color: #64748b; margin: 0; line-height: 1.5;">
            Enter your email address and we'll send you a link to reset your password.
        </p>
    </div>

    <!-- Form -->
    <form id="forgotPasswordForm" style="display: flex; flex-direction: column; gap: 16px;">
        
        <div>
            <label for="email" style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 6px;">
                Email Address
            </label>
            <input
                id="email"
                type="email"
                placeholder="name@company.com"
                required
                style="width: 100%; padding: 10px 14px; font-size: 0.95rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box;"
                onfocus="this.style.borderColor='#6366f1'; this.style.boxShadow='0 0 0 3px rgba(99, 102, 241, 0.15)';"
                onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none';"
            >
        </div>

        <button 
            type="submit" 
            class="primary-btn"
            style="width: 100%; padding: 11px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; border: none; transition: transform 0.1s, opacity 0.2s;"
        >
            Send Reset Link
        </button>

    </form>

    <!-- Back to Login Link -->
    <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: #64748b;">
        Remembered your password? 
        <a href="/login" style="color: #4f46e5; font-weight: 600; text-decoration: none;">Back to Login</a>
    </div>

</div>

<script src="/static/js/forgot-password.js"></script>

{% endblock %}
