{% extends "base.html" %}


{% block title %}
Edit Comment
{% endblock %}
{% block content %}
<section class="create-page">
    <div class="create-card comment-edit-card">
        <div class="create-header">
            <h1>
                Edit Comment
            </h1>

            <p>
                Update your comment and save changes.
            </p>
        </div>
        <form
            method="post"
            action="/comments/{{ comment.id }}/edit"
        >
            <div class="form-group">
                <label for="content">
                    Comment
                </label>
                <textarea
                    id="content"
                    name="content"
                    required
                >{{ comment.content }}</textarea>
            </div>
            <button
                class="primary-btn"
                type="submit"
            >
                Save Changes
            </button>
        </form>
    </div>

</section>
{% endblock %}
