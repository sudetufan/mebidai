{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<section class="login-page">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Welcome Back </h1>
            <p>
                Sign in to continue using <strong>MEBIDAI</strong>.
            </p>
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="name@example.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="••••••••"
                    required
                >

            </div>

            <button class="primary-btn" type="submit">
                Sign In
            </button>

        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div id="g_id_onload"
            data-client_id="{{ google_client_id }}"
            data-callback="handleGoogleLogin">
        </div>

        <div
            class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-size="large"
            data-text="continue_with"
            data-shape="rectangular"
            data-logo_alignment="left">
        </div>

        <script src="https://accounts.google.com/gsi/client" async defer></script>

        <div class="auth-footer">

            <a href="/forgot-password">
                Forgot your password?
            </a>

            <p>
                Don't have an account?

                <a href="/register">
                    Create one
                </a>
            </p>

        </div>

    </div>

</section>

<script src="/static/js/login.js"></script>

{% endblock %}
