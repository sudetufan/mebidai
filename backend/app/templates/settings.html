{% extends "base.html" %}

{% block title %}
Settings
{% endblock %}

{% block content %}
<div id="toast-container" class="toast-container"></div>

<section class="settings-page">
    <div class="settings-container">

        <aside class="settings-menu">
            <h2>Settings</h2>

            <a class="active" data-section="account">
                Account
            </a>

            <a data-section="profile">
                Profile
            </a>

            <a data-section="security">
                Security
            </a>
        </aside>

        <div class="settings-content">

            <div class="settings-card settings-section" id="account">
                <h2>Account Settings</h2>

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Username"
                    value="{{ current_user.username if current_user else '' }}"
                >

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    value="{{ current_user.email if current_user else '' }}"
                    disabled
                >

                <button id="saveUsername" type="button">
                    Save Changes
                </button>
            </div>

            <div class="settings-card settings-section" id="profile">
                <h2>Profile Settings</h2>

                <label for="bio">
                    Bio
                </label>

                <textarea
                    id="bio"
                    placeholder="Tell something about yourself..."
                >{{ current_user.bio if current_user and current_user.bio else '' }}</textarea>

                <button
                    id="saveBio"
                    type="button"
                >
                    Save Bio
                </button>
            </div>

            <div class="settings-card settings-section" id="security">
                <h2>Security</h2>

                <label for="currentPassword">
                    Current Password
                </label>

                <input
                    id="currentPassword"
                    type="password"
                    placeholder="Current Password"
                >

                <label for="newPassword">
                    New Password
                </label>

                <input
                    id="newPassword"
                    type="password"
                    placeholder="New Password"
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm Password"
                >

                <button id="changePassword" type="button">
                    Change Password
                </button>
            </div>

        </div>

    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/settings.js"></script>
{% endblock %}
